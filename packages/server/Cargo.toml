[package]
name = "nx-remote-cache"
version = "0.4.2"
edition = "2024"
rust-version = "1.89"
description = "Self-hosted Nx remote cache server implementing the Nx OpenAPI spec, backed by Azure Blob Storage"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
azure_core = "1.1.0"
azure_identity = "1.0.0"
azure_storage_blob = "1.1.0"
bytes = "1"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[features]
# The `sas` storage auth mode, for Azurite only: the Azurite tests and the offline Docker Compose
# stack. Release builds leave it out, so they only ever use Entra identities.
azurite = []

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }

[[test]]
name = "azurite"
required-features = ["azurite"]
