# Fully local stack: Azurite (Azure Blob emulator) + the cache server, built with the
# `azurite` feature for the `sas` storage auth mode.
#
#   docker compose -f packages/server/docker-compose.yml up --build   # or: npx nx run server:compose
#   export NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://localhost:3000
#   export NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=local-write-token   # or local-read-token
#
# AZURITE_SAS below is an account SAS signed with Azurite's PUBLIC well-known dev key. It is
# not a secret and only works against the emulator.

x-azurite-sas: &azurite-sas "se=2035-01-01T00%3A00Z&sp=rwdlac&sv=2026-04-06&ss=b&srt=sco&sig=cO88Suxa2pemR0IUIqL5uQm6F%2BL1Z18nhX7zSLZ8up8%3D"

# Pinned so the project (and its volumes) keep their names wherever this file lives.
name: nx-remote-cache

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
    ports: ["127.0.0.1:10000:10000"]

  create-container:
    image: curlimages/curl
    depends_on: [azurite]
    environment:
      AZURITE_SAS: *azurite-sas
    # 201 = created, 409 = already exists; retry until Azurite is listening.
    entrypoint:
      - sh
      - -c
      - |
        for i in $$(seq 1 30); do
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'x-ms-version: 2025-01-05' -H 'Content-Length: 0' \
            "http://azurite:10000/devstoreaccount1/nx-cache?restype=container&$$AZURITE_SAS")
          [ "$$code" = 201 ] || [ "$$code" = 409 ] && exit 0
          sleep 1
        done
        exit 1

  nx-remote-cache:
    build:
      # The Cargo workspace root.
      context: ../..
      dockerfile: packages/server/Dockerfile
      # Adds the `sas` storage auth mode, which only works against Azurite.
      args: { FEATURES: azurite }
    depends_on:
      create-container:
        condition: service_completed_successfully
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./config/local.toml:/etc/nx-remote-cache/config.toml:ro
    environment:
      AZURE_STORAGE_SAS_TOKEN: *azurite-sas
      NX_CACHE__STORAGE__ENDPOINT: http://azurite:10000/devstoreaccount1
