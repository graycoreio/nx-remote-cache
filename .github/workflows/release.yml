name: Release

# A `v*` tag publishes binaries (GitHub release assets), multi-arch images (GHCR) and the Nx
# plugin with its platform packages (npm).
# Pull requests touching the release build, and manual runs, build and smoke test everything
# without publishing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packages/server/Dockerfile
      - packages/server/scripts/build-release.sh
      - packages/server/scripts/archive-release.sh
      - packages/server/scripts/smoke-test-binary.sh
      - packages/nx-plugin/scripts/stage-packages.mjs
  workflow_dispatch:

# A newer push to a pull request supersedes its running checks. Runs on main and on tags are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Built in Debian 12 (the image's runtime), so the binaries need glibc 2.34+. Starts from the
  # cache CI saves on main (same container, shared key, same cargo command).
  linux:
    runs-on: ${{ matrix.runner }}
    container: rust:1.99-bookworm
    strategy:
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { arch: arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          # A cache saved by a tag run is only visible to that tag.
          save-if: ${{ github.ref_type != 'tag' }}
      - run: packages/server/scripts/build-release.sh out ${{ matrix.target }}
      - run: packages/server/scripts/smoke-test-binary.sh out/nx-remote-cache
      - run: packages/server/scripts/archive-release.sh out ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # One universal binary (Apple Silicon + Intel).
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in step with the Dockerfile's rust image.
      - uses: dtolnay/rust-toolchain@1.99
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref_type != 'tag' }}
      - run: packages/server/scripts/build-release.sh out aarch64-apple-darwin x86_64-apple-darwin
      - name: Smoke test
        run: |
          packages/server/scripts/smoke-test-binary.sh out/nx-remote-cache
          # The Intel slice, under Rosetta.
          arch -x86_64 out/nx-remote-cache hash-token smoke >/dev/null
      - run: packages/server/scripts/archive-release.sh out universal-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: binary-universal-apple-darwin
          path: dist/*.tar.gz
          if-no-files-found: error

  # The image packages the Linux release binaries rather than compiling again; no RUN steps, so
  # the arm64 image needs no emulation.
  image:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*-linux-gnu
          path: ${{ runner.temp }}/archives
          merge-multiple: true
      - name: Unpack per architecture
        run: |
          prebuilt="$RUNNER_TEMP/prebuilt"
          mkdir -p "$prebuilt/amd64" "$prebuilt/arm64"
          tar -xzf "$RUNNER_TEMP"/archives/*-x86_64-unknown-linux-gnu.tar.gz -C "$prebuilt/amd64"
          tar -xzf "$RUNNER_TEMP"/archives/*-aarch64-unknown-linux-gnu.tar.gz -C "$prebuilt/arm64"
          ls -lR "$prebuilt"
      - uses: docker/setup-buildx-action@v4
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile
          build-contexts: binary=${{ runner.temp }}/prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    if: github.ref_type == 'tag'
    needs: [linux, darwin]
    runs-on: ubuntu-latest
    # No build-provenance attestation: GitHub only offers it for private repositories on
    # Enterprise Cloud. Add actions/attest back if the repository goes public.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz | tee SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber

  # The Nx plugin and one package per platform holding its binary, from the same archives as the
  # GitHub release. Outside a tag run, only staged and packed, to check they build.
  npm:
    needs: [linux, darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true
      - run: npm ci --no-audit --no-fund
      - name: Stage the packages
        run: npx nx run nx-plugin:build-platform:ci
      - run: echo "VERSION=$(jq -r .version packages/nx-plugin/package.json)" >> "$GITHUB_ENV"
      # A hyphen marks a semver prerelease, e.g. 0.5.0-beta.1.
      - name: Is prerelease
        id: is-prerelease
        run: |
          if [[ "$VERSION" == *-* ]]; then echo "result=true"; else echo "result=false"; fi >> "$GITHUB_OUTPUT"
      # order.txt lists the three platform packages, then the plugin, which depends on them.
      - name: Pack (dry run)
        if: github.ref_type != 'tag'
        run: |
          while read -r dir; do
            (cd "$dir" && npm pack --dry-run)
          done < "$RUNNER_TEMP/npm/order.txt"
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Prereleases go to `next`, so `latest` stays on the last stable release.
          DIST_TAG: ${{ steps.is-prerelease.outputs.result == 'true' && 'next' || 'latest' }}
        run: |
          while read -r dir; do
            name=$(jq -r .name "$dir/package.json")
            # A re-run of a half-failed release skips what it already published.
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
              continue
            fi
            (cd "$dir" && npm publish --access public --tag "$DIST_TAG")
          done < "$RUNNER_TEMP/npm/order.txt"
