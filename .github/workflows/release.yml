name: Release

# A `v*` tag publishes binaries (GitHub release assets) and multi-arch images (GHCR).
# Pull requests touching the release build, and manual runs, build and smoke test everything
# without publishing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - scripts/build-release.sh
      - scripts/archive-release.sh
      - scripts/smoke-test-binary.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Built in Debian 12 (the image's runtime), so the binaries need glibc 2.34+. Starts from the
  # cache CI saves on main (same container, shared key, same cargo command).
  linux:
    runs-on: ${{ matrix.runner }}
    container: rust:1.99-bookworm
    strategy:
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { arch: arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          # A cache saved by a tag run is only visible to that tag.
          save-if: ${{ github.ref_type != 'tag' }}
      - run: scripts/build-release.sh out ${{ matrix.target }}
      - name: Smoke test
        run: |
          scripts/smoke-test-binary.sh out/default/nx-remote-cache
          scripts/smoke-test-binary.sh out/mint/nx-remote-cache
      - name: Archive
        run: scripts/archive-release.sh out ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: binary-default-${{ matrix.target }}
          path: dist/default/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: binary-mint-${{ matrix.target }}
          path: dist/mint/*.tar.gz
          if-no-files-found: error

  # One universal binary (Apple Silicon + Intel) per variant.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in step with the Dockerfile's rust image.
      - uses: dtolnay/rust-toolchain@1.99
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref_type != 'tag' }}
      - run: scripts/build-release.sh out aarch64-apple-darwin x86_64-apple-darwin
      - name: Smoke test
        run: |
          for variant in default mint; do
            scripts/smoke-test-binary.sh out/$variant/nx-remote-cache
            # The Intel slice, under Rosetta.
            arch -x86_64 out/$variant/nx-remote-cache hash-token smoke >/dev/null
          done
      - name: Archive
        run: scripts/archive-release.sh out universal-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: binary-default-universal-apple-darwin
          path: dist/default/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: binary-mint-universal-apple-darwin
          path: dist/mint/*.tar.gz
          if-no-files-found: error

  # The image packages the Linux release binaries rather than compiling again; no RUN steps, so
  # the arm64 image needs no emulation.
  image:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant:
          - { name: default, suffix: '' }
          - { name: mint, suffix: '-mint' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-${{ matrix.variant.name }}-*-linux-gnu
          path: ${{ runner.temp }}/archives
          merge-multiple: true
      - name: Unpack per architecture
        run: |
          prebuilt="$RUNNER_TEMP/prebuilt"
          mkdir -p "$prebuilt/amd64" "$prebuilt/arm64"
          tar -xzf "$RUNNER_TEMP"/archives/*-x86_64-unknown-linux-gnu.tar.gz -C "$prebuilt/amd64"
          tar -xzf "$RUNNER_TEMP"/archives/*-aarch64-unknown-linux-gnu.tar.gz -C "$prebuilt/arm64"
          ls -lR "$prebuilt"
      - uses: docker/setup-buildx-action@v4
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=${{ matrix.variant.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: binary=${{ runner.temp }}/prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    if: github.ref_type == 'tag'
    needs: [linux, darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz | tee SHA256SUMS
      # Verify with: gh attestation verify <archive> --repo graycoreio/nx-remote-cache
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
