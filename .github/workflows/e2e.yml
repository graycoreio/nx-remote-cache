# End-to-end test through the nx-remote-cache action and a real Nx client, with the server built
# from this commit running inside the job and using storage directly (packages/terraform). The
# action is this commit's (packages/github-action), so it is tested together with the server.
#
# Push to main → the action requests the WRITER identity: uploads must land and be read back.
# Pull request → the READER identity: reads work, uploads are skipped without failing the run.
# (No workflow_dispatch: its OIDC subject is the branch, which matches neither identity's
# federated credential on non-main branches, and asks for the reader identity on main.)
#
# Configure with repository variables (Settings → Secrets and variables → Actions → Variables),
# from the Terraform module's outputs. The job is skipped while they are unset:
#   NX_CACHE_E2E_TENANT_ID, NX_CACHE_E2E_STORAGE_ACCOUNT, NX_CACHE_E2E_STORAGE_CONTAINER,
#   NX_CACHE_E2E_WRITER_CLIENT_ID, NX_CACHE_E2E_READER_CLIENT_ID
#
# The "shared entry" check on PRs reads an entry written by a main run, so main must have run
# this workflow at least once against the deployment.

name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_VERSION: 23.3.0
  SERVER_BIN: ${{ github.workspace }}/target/debug/nx-remote-cache
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  e2e:
    # Fork PRs get no OIDC token (the action then turns the cache off), so there is nothing to test.
    if: >-
      vars.NX_CACHE_E2E_STORAGE_ACCOUNT != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A debug build: quicker to compile, and behaves the same as a release build.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the server from this commit
        run: cargo build --locked

      - name: Create a throwaway Nx workspace
        run: |
          ws="$RUNNER_TEMP/nxws"
          mkdir -p "$ws/libs/e2e"
          cd "$ws"
          cat > package.json <<EOF
          { "name": "nx-cache-e2e", "private": true, "devDependencies": { "nx": "$NX_VERSION" } }
          EOF
          echo '{ "targetDefaults": { "build": { "cache": true } } }' > nx.json
          # Outputs live outside the project root so deleting them doesn't change the hash.
          cat > libs/e2e/project.json <<'EOF'
          { "name": "e2e", "root": "libs/e2e",
            "targets": { "build": {
              "command": "mkdir -p dist/e2e && echo \"$(date +%s%N)-$RANDOM\" > dist/e2e/out.txt",
              "outputs": ["{workspaceRoot}/dist/e2e"] } } }
          EOF
          git init -q
          npm install --no-audit --no-fund --silent
          echo "NXWS=$ws" >> "$GITHUB_ENV"

      - name: Configure the remote cache (action under test)
        uses: ./packages/github-action
        with:
          tenant-id: ${{ vars.NX_CACHE_E2E_TENANT_ID }}
          writer-client-id: ${{ vars.NX_CACHE_E2E_WRITER_CLIENT_ID }}
          reader-client-id: ${{ vars.NX_CACHE_E2E_READER_CLIENT_ID }}
          storage-account: ${{ vars.NX_CACHE_E2E_STORAGE_ACCOUNT }}
          storage-container: ${{ vars.NX_CACHE_E2E_STORAGE_CONTAINER }}
          server-binary: ${{ env.SERVER_BIN }}

      - name: Expected access
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "WANT=write" >> "$GITHUB_ENV"
          else
            echo "WANT=read" >> "$GITHUB_ENV"
          fi

      - name: Protocol checks
        run: |
          url="$NX_SELF_HOSTED_REMOTE_CACHE_SERVER/v1/cache"
          auth="Authorization: Bearer $NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN"
          hash="e2eprobe${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}local"
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          expect() { [ "$2" = "$3" ] && echo "ok   $1: $2" || { echo "::error::$1: expected $3, got $2"; exit 1; }; }

          expect "GET missing entry" "$(status -H "$auth" "$url/$hash")" 404
          expect "GET without token" "$(status "$url/$hash")" 401
          if [ "$WANT" = write ]; then
            expect "PUT new entry" "$(status -X PUT -H "$auth" --data probe "$url/$hash")" 200
            expect "PUT same entry again" "$(status -X PUT -H "$auth" --data other "$url/$hash")" 409
            expect "GET stored entry" "$(curl -s -H "$auth" "$url/$hash")" probe
          else
            expect "PUT with reader token" "$(status -X PUT -H "$auth" --data probe "$url/$hash")" 403
            expect "GET after refused PUT" "$(status -H "$auth" "$url/$hash")" 404
          fi

      - name: Nx round trip (new hash per run)
        working-directory: ${{ env.NXWS }}
        run: |
          build() { npx nx build e2e --output-style=static 2>&1 | tee "$RUNNER_TEMP/nx.log"; }
          fresh() { npx nx reset >/dev/null 2>&1; rm -rf dist; }

          echo "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-local" > libs/e2e/input.txt
          fresh; build
          first=$(cat dist/e2e/out.txt)
          fresh; build
          if [ "$WANT" = write ]; then
            grep -q '\[remote cache\]' "$RUNNER_TEMP/nx.log" || { echo "::error::writer: second build was not served from the remote cache"; exit 1; }
            [ "$(cat dist/e2e/out.txt)" = "$first" ] || { echo "::error::writer: restored output differs"; exit 1; }
            echo "ok   writer: stored, then restored byte-identical output"
          else
            ! grep -q '\[remote cache\]' "$RUNNER_TEMP/nx.log" || { echo "::error::reader: upload was not skipped"; exit 1; }
            echo "ok   reader: upload skipped without failing the run"
          fi

      - name: Nx shared entry (written by main, read by PRs)
        working-directory: ${{ env.NXWS }}
        run: |
          echo "shared-v1" > libs/e2e/input.txt
          npx nx reset >/dev/null 2>&1; rm -rf dist
          npx nx build e2e --output-style=static 2>&1 | tee "$RUNNER_TEMP/nx.log"
          if [ "$WANT" = write ]; then
            # First main run stores it; later ones hit it (and Nx's upload then gets a silent 409).
            echo "ok   writer: shared entry built or restored"
          else
            grep -q '\[remote cache\]' "$RUNNER_TEMP/nx.log" \
              || { echo "::error::reader: shared entry not found; has main run this workflow against this deployment?"; exit 1; }
            echo "ok   reader: read the entry main wrote"
          fi

      # The local server and its config run on the runner, so they are not a security boundary:
      # the identity's role on the container is. Prove it with a local server configured as
      # WRITABLE but running with the READER identity. Azure must refuse the write.
      - name: Azure enforces read-only for the reader identity (local mode)
        if: env.WANT == 'read'
        env:
          TENANT_ID: ${{ vars.NX_CACHE_E2E_TENANT_ID }}
          READER_CLIENT_ID: ${{ vars.NX_CACHE_E2E_READER_CLIENT_ID }}
          STORAGE_ACCOUNT: ${{ vars.NX_CACHE_E2E_STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ vars.NX_CACHE_E2E_STORAGE_CONTAINER }}
        run: |
          dir="$RUNNER_TEMP/boundary"; mkdir -p "$dir"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -er .value > "$dir/token"
          token=$(openssl rand -hex 32)
          config="[server]
          listen = \"127.0.0.1:3999\"
          [storage]
          type = \"azure\"
          account = \"$STORAGE_ACCOUNT\"
          container = \"$STORAGE_CONTAINER\"
          auth = { mode = \"workload_identity\", tenant_id = \"$TENANT_ID\", client_id = \"$READER_CLIENT_ID\" }
          [[auth.providers]]
          type = \"static\"
          tokens = [{ name = \"boundary\", sha256 = \"$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)\", scope = \"read_write\" }]"
          # In its own directory, so no config.toml from the checkout is picked up.
          (cd "$dir" && NX_CACHE_CONFIG_TOML="$config" AZURE_FEDERATED_TOKEN_FILE="$dir/token" \
            exec "$SERVER_BIN" serve > "$dir/server.log" 2>&1) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3999/health 2>/dev/null && break
            kill -0 "$pid" 2>/dev/null || { echo "::error::the server exited at startup"; cat "$dir/server.log"; exit 1; }
            sleep 1
          done

          hash="e2eboundary${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          put=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $token" --data probe "http://127.0.0.1:3999/v1/cache/$hash")
          get=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "http://127.0.0.1:3999/v1/cache/$hash")
          # 403 (not 500), so Nx would skip the upload rather than fail the run.
          [ "$put" = 403 ] || { echo "::error::PUT with the reader identity: expected storage to refuse the write (403), got $put"; cat "$dir/server.log"; exit 1; }
          [ "$get" = 404 ] || { echo "::error::expected nothing stored, got $get"; exit 1; }
          grep -q AuthorizationPermissionMismatch "$dir/server.log" || { echo "::error::expected Azure to refuse the write"; cat "$dir/server.log"; exit 1; }
          echo "ok   reader identity: Azure refused the write (AuthorizationPermissionMismatch), nothing stored"
