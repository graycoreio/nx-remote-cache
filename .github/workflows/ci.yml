name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes its running checks. Runs on main and on tags are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NX_DAEMON: 'false'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx nx run server:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Runs unit, API, spec and Azurite-backed store tests.
      - run: npx nx run server:test

  # The Nx plugin (packages/nx-plugin): type check, build and unit tests.
  nx-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx nx run nx-plugin:test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --all-features

  # The release build of the default variant, exactly as the release workflow runs it: on main
  # it saves the cache that release builds (and later PRs) start from.
  release-build:
    runs-on: ubuntu-latest
    container: rust:1.99-bookworm
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-unknown-linux-gnu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: packages/server/scripts/smoke-test-binary.sh target/x86_64-unknown-linux-gnu/release/nx-remote-cache
      - uses: actions/upload-artifact@v7
        with:
          name: binary
          path: target/x86_64-unknown-linux-gnu/release/nx-remote-cache
          retention-days: 1

  # Packages that binary the way releases do (no compiling in Docker), then runs the image.
  docker:
    needs: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binary
          path: ${{ runner.temp }}/prebuilt/amd64
      - run: chmod +x "$RUNNER_TEMP/prebuilt/amd64/nx-remote-cache"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile
          build-contexts: binary=${{ runner.temp }}/prebuilt
          push: false
          load: true
          tags: nx-remote-cache:ci
      - name: Smoke test the image
        run: |
          docker run -d --name cache -p 3000:3000 \
            -e NX_CACHE_CONFIG_TOML="$(printf '[storage]\ntype = "memory"\n[[auth.providers]]\ntype = "static"\ntokens = [{ name = "smoke", sha256 = "04d588cb41b8022d1233924f0fe8280d9e2bb92cdc81658eb102ef9c42fc9452", scope = "read" }]\n')" \
            nx-remote-cache:ci
          for _ in $(seq 1 20); do curl -sf localhost:3000/health && break; sleep 1; done
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(status localhost:3000/v1/cache/123)" = 401
          # The read-only token "smoke".
          test "$(status -H 'Authorization: Bearer smoke' localhost:3000/v1/cache/123)" = 404
          test "$(status -H 'Authorization: Bearer smoke' -X PUT -H 'Content-Length: 1' --data x localhost:3000/v1/cache/123)" = 403
          docker logs cache
