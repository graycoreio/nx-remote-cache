name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features mint -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
      # Runs unit, API, spec, mint and Azurite-backed store tests.
      - run: scripts/azurite-test.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --features mint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nx-remote-cache:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name cache -p 3000:3000 \
            -e NX_CACHE_CONFIG_TOML="$(printf '[storage]\ntype = "memory"\n[[auth.providers]]\ntype = "anonymous"\nscope = "read"\n')" \
            nx-remote-cache:ci
          for _ in $(seq 1 20); do curl -sf localhost:3000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/v1/cache/123)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Length: 1' --data x localhost:3000/v1/cache/123)" = 403
          docker logs cache
